<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Koniec zápasu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="post-container">

  <h1 class="post-title">Koniec zápasu</h1>

  <div class="post-form">

    <div class="form-group">
      <label>Rozhodca</label>
      <input type="text" id="referee">
    </div>

    <div class="form-group">
      <label>Lekár</label>
      <input type="text" id="doctor">
    </div>

    <div class="form-group">
      <label>Poznámky</label>
      <textarea id="notes"></textarea>
    </div>

    <button id="saveBtn" class="post-save-btn" onclick="finishApp()">
      Uložiť
    </button>

  </div>

</div>

<script>
async function finishApp() {
  // 1. Nájdeme tlačidlo, zablokujeme ho a zmeníme text
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.innerText = "Ukladám...";
  saveBtn.style.opacity = "0.7"; // Vizuálne ho trošku "zhasneme"

  const params = new URLSearchParams(window.location.search);
  const matchId = params.get("match");

  if (!matchId) {
    alert("Chýba ID zápasu");
    // Ak je chyba, vrátime tlačidlo do pôvodného stavu
    saveBtn.disabled = false;
    saveBtn.innerText = "Uložiť";
    saveBtn.style.opacity = "1";
    return;
  }

  const referee = document.getElementById("referee").value;
  const doctor = document.getElementById("doctor").value;
  const notes = document.getElementById("notes").value;

  try {
    await fetch(
      "https://Lucifer21sk.pythonanywhere.com/matches/report",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          match_id: matchId,
          referee: referee,
          doctor: doctor,
          notes: notes
        })
      }
    );

    // Koniec celého procesu → späť na začiatok
    window.location.href = "select_teams.html";

  } catch (err) {
    console.error("Saving match report failed", err);
    alert("Nepodarilo sa uložiť zápis zápasu. Skontrolujte pripojenie.");
    
    // 2. Ak to spadne (napríklad vypadol internet), tlačidlo opäť zapneme
    saveBtn.disabled = false;
    saveBtn.innerText = "Uložiť";
    saveBtn.style.opacity = "1";
  }
}
</script>

</body>
</html>
